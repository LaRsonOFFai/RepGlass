name: Build and verify RepGlass

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repglass-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck, unit tests, and production build
        working-directory: app
        run: npm run verify

      - name: Electron interface tests
        working-directory: app
        run: npm run test:e2e

      - name: Production dependency audit
        working-directory: app
        run: npm audit --omit=dev

      - name: Build Windows installer and portable app
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      - name: Smoke-test packaged application
        working-directory: app
        run: npm run smoke:packaged

      - name: Upload Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: RepGlass-Windows
          path: |
            app/release/*.exe
            app/release/*.yml
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Typecheck, lint, unit tests, and production build
        working-directory: app
        run: npm run verify

      - name: Build macOS DMG and ZIP
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac:${{ matrix.arch }}

      - name: Smoke-test packaged application and bundled Codex
        working-directory: app
        run: npm run smoke:packaged

      - name: Upload macOS packages
        uses: actions/upload-artifact@v6
        with:
          name: RepGlass-macOS-${{ matrix.arch }}
          path: |
            app/release/*.dmg
            app/release/*.zip
          if-no-files-found: error
          retention-days: 14
